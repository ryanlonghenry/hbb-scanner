name: HBB daily scan

on:
  schedule:
    # 22:20 UTC Mon-Fri = 4:20 pm Central in winter, 5:20 pm in summer (after the US close)
    - cron: "20 22 * * 1-5"
    # backup run 23:50 UTC in case GitHub starts the first one late (a second run the same day is harmless)
    - cron: "50 23 * * 1-5"
  workflow_dispatch: {}     # "Run workflow" button for a manual scan

permissions:
  contents: write

concurrency:
  group: hbb-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Scan
        run: python scan.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git commit -m "Daily scan $(date -u +%F)" || echo "No changes"
          git push
